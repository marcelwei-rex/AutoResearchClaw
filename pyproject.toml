[project]
name = "researchclaw"
version = "0.5.0"
description = "AutoResearchClaw — Autonomous Research Pipeline. Turn any research idea into a paper."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "markdown-it-py==4.2.0",
    "arxiv>=2.1",
    "numpy>=1.24",
]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
anthropic = ["httpx>=0.24"]
web = ["scholarly>=1.7", "crawl4ai>=0.2", "tavily-python>=0.3"]
pdf = ["PyMuPDF>=1.23"]
trojnet-validation = [
    "networkx==3.6.1",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "torch==2.12.1",
    "torch-geometric==2.8.0",
]
all = [
    "httpx>=0.24",
    "scholarly>=1.7",
    "crawl4ai>=0.2",
    "tavily-python>=0.3",
    "PyMuPDF>=1.23",
    "huggingface-hub>=0.20",
    "matplotlib>=3.7",
    "scipy>=1.10",
]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.scripts]
researchclaw = "researchclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["researchclaw", "sibyl", "arc"]

[tool.hatch.build.targets.wheel.force-include]
"researchclaw/templates/styles" = "researchclaw/templates/styles"
"researchclaw/experiment_runtime/validation_fixtures/trojnet_iscas85_v1/data" = "researchclaw/experiment_runtime/validation_fixtures/trojnet_iscas85_v1/data"
"researchclaw/experiment_runtime/validation_fixtures/trojnet_iscas85_v1/provenance.json" = "researchclaw/experiment_runtime/validation_fixtures/trojnet_iscas85_v1/provenance.json"
"researchclaw/experiment_runtime/validation_fixtures/trojnet_iscas85_v1/policy.json" = "researchclaw/experiment_runtime/validation_fixtures/trojnet_iscas85_v1/policy.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
